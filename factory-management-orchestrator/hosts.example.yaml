#
# Node and deployment inventory. Copy to hosts.yaml or pass --hosts FILE.
# Check it without touching any node:  ./weld-fleet-setup.sh --list
#
# No passwords: the script uses key-based SSH. On the first run it creates identity_file if it is
# missing and runs ssh-copy-id, which asks for the node user's password once in your terminal.

recipes:
  weld:
    source_delivery: central_copy
    repository: https://github.com/vkb1/manufacturing-ai-suite.git
    ref: feature/hermes-skill-mcp-integration
    remote_root: manufacturing-weld
    app_dir: industrial-edge-insights-multimodal
    skill:
      name: multimodal-deploy
      path: industrial-edge-insights-multimodal/.github/skills/multimodal-deploy
      # repository/ref can override the app repository/ref for a separate skill source.
    prompt: >-
      In ~/manufacturing-weld/industrial-edge-insights-multimodal, use multimodal-deploy
      to meet prerequisites, build the time-series microservice from source, and deploy
      the agentic app with its MCP server (make up_agentic MCP=true).
      Ask for model license acceptance when required; do not assume acceptance.
      Run the smoke check. Do not edit .env or start or stop pipelines.
    approval_policy: >-
      APPROVE make build, make up_agentic MCP=true, make status and the skill smoke check
      only in ~/manufacturing-weld/industrial-edge-insights-multimodal.
      ESCALATE sudo, .env edits, license acceptance and all other commands.
    environment:
      generate_users:
        - INFLUXDB_USERNAME
        - VISUALIZER_GRAFANA_USER
        - MTX_WEBRTCICESERVERS2_0_USERNAME
        - S3_STORAGE_USERNAME
        - SEAWEEDFS_WEB_AUTH_USER
        - MCP_USERNAME
      generate_passwords:
        - INFLUXDB_PASSWORD
        - VISUALIZER_GRAFANA_PASSWORD
        - MTX_WEBRTCICESERVERS2_0_PASSWORD
        - S3_STORAGE_PASSWORD
        - SEAWEEDFS_WEB_AUTH_PASSWORD
        - MCP_PASSWORD
      set:
        HOST_IP: "127.0.0.1"
    mcp:
      scheme: https
      port: 3000
      path: /mcp
      certificate:
        container: nginx_proxy
        path: /opt/nginx/certs/cert.pem
      auth:
        type: basic
        username_key: MCP_USERNAME
        password_key: MCP_PASSWORD
      tools:
        - describe
        - list_insights_data
        - explain
        - run_agent
        - get_run_results
        - start_pipeline
        - stop_pipeline

defaults:
  user: deploy                          # same deployment account on every node (see the guide)
  port: 22                              # SSH port
  identity_file: ~/.ssh/weld_fleet_ed25519   # created if missing; omit to use your default SSH key
  skip_platform_check: false            # true only for CI/validation on non-Panther Lake hardware

nodes:
  - name: node1
    host: 192.168.1.21                  # IPv4 address or hostname
    deployments:
      - recipe: weld
        name: weld_node1               # stable MCP server/profile identity
        local_port: 13001
  - name: node2
    host: weld-line1-b.example.local
    port: 2222                          # any default can be overridden per node
    deployments:
      - recipe: weld
        name: weld_node2
        local_port: 13002               # explicit unique local port for every deployment
