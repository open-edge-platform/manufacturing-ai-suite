services:
  dlstreamer-pipeline-server:
    volumes:
      - ./configs/dlstreamer-pipeline-server/config_auto_start_off.json:/home/pipeline-server/config.json

  multimodal-mcp-server:
    container_name: multimodal-mcp-server
    hostname: multimodal-mcp-server
    build:
      context: $PWD/mcp-server
      dockerfile: $PWD/mcp-server/Dockerfile
    image: ${DOCKER_REGISTRY}${MULTIMODAL_MCP_SERVER_IMAGE}:${IMAGE_SUFFIX:-latest}${WEEKLY_BUILD_DATE:+-${WEEKLY_BUILD_DATE}}${WEEKLY_BUILD_DATE:+-weekly}
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    depends_on:
      dlstreamer-pipeline-server:
        condition: service_started
      ia-time-series-analytics-microservice:
        condition: service_started
    environment:
      DLSPS_API_URL: http://dlstreamer-pipeline-server:8080
      TIME_SERIES_API_URL: http://ia-time-series-analytics-microservice:5000
      EXPLAIN_API_URL: http://multimodal-agentic-ui:5003
      APM_AGENT_URL: http://apm-agent:5002
      MCP_USERNAME: ${MCP_USERNAME:-}
      MCP_PASSWORD: ${MCP_PASSWORD:-}
      no_proxy: "${no_proxy:-},ia-influxdb,vllm-server,seaweedfs-filer,apm-agent,ia-fusion-analytics,ia-mqtt-broker,multimodal-agentic-ui,localhost"
      NO_PROXY: "${no_proxy:-},ia-influxdb,vllm-server,seaweedfs-filer,apm-agent,ia-fusion-analytics,ia-mqtt-broker,multimodal-agentic-ui,localhost"
    volumes:
      - ./configs/dlstreamer-pipeline-server:/app/configs/dlstreamer-pipeline-server:ro
      - ./configs/time-series-analytics-microservice:/app/configs/time-series-analytics-microservice:ro
    networks:
      - timeseries_network