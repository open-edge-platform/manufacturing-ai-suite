name: "[industrial-edge-insights-vision] Sanity Workflow"

on:
  workflow_dispatch:      # allows manual trigger
    inputs:
      branch:
        description: "Branch to run job on"
        required: false
        default: "main"

  workflow_call:          # allows being called from another workflow
    inputs:
      branch:
        description: "Branch to run job on"
        required: false
        type: string

jobs:
  sanity:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu_version: ubuntu24
    steps:
    - name: Determine branch
      id: get_branch
      env:
        INPUT_BRANCH: ${{ inputs.branch }}
        EVENT_INPUTS_BRANCH: ${{ github.event.inputs.branch }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ -n "$INPUT_BRANCH" ]; then
          echo "branch=$INPUT_BRANCH" >> $GITHUB_OUTPUT
        elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "branch=$EVENT_INPUTS_BRANCH" >> $GITHUB_OUTPUT
        else
          echo "branch=$REF_NAME" >> $GITHUB_OUTPUT
        fi
    - name: Check out manufacturing-ai-suite repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        path: manufacturing-ai-suite-repo
        ref: ${{ steps.get_branch.outputs.branch }}
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'
    - name: Install Robot Framework with pip (cached)
      # PyPI nose 1.3.7 is incompatible with Python 3.10+; pynose provides the same nose module.
      run: pip3 install robotframework selenium PyYAML requests pynose
    - name: Install required packages
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-nose libxml2-utils vlc
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Sanity Test 
      run: | 
       
       cd manufacturing-ai-suite-repo/industrial-edge-insights-vision/tests/robot_files
       robot test.robot || true 
       mkdir -p /tmp/test_results
       cp -r report.html log.html output.xml /tmp/test_results/
       summary_file=/tmp/validation-summary.md
          {
            echo "# IRD Apps Weekly Validation Report"
            echo
            echo "| Test | Total | Passed | Failed | Not Run |"
            echo "| --- | ---: | ---: | ---: | ---: |"
          } > "$summary_file"
          shopt -s nullglob
          for output_file in /tmp/test_results/output.xml; do
            test_name=$(basename "$(dirname "$output_file")")
            passed=$(xmllint --xpath "count(//test/status[@status='PASS'])" "$output_file" 2>/dev/null || echo 0)
            failed=$(xmllint --xpath "count(//test/status[@status='FAIL'])" "$output_file" 2>/dev/null || echo 0)
            not_run=$(xmllint --xpath "count(//test/status[@status='NOT RUN'])" "$output_file" 2>/dev/null || echo 0)
            total=$((passed + failed + not_run))
            echo "| $test_name | $total | $passed | $failed | $not_run |" >> "$summary_file"
          done
          if [[ $(wc -l < "$summary_file") -eq 4 ]]; then
            echo "| No test results | 0 | 0 | 0 | 0 |" >> "$summary_file"
          fi
          echo "" >> "$summary_file"
          echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$summary_file"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'body<<EOF'
            cat "$summary_file"
            echo EOF
          } >> "$GITHUB_OUTPUT"

    - name: Upload Scan artifact to Github
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: Sanity_Reports
        path: /tmp/test_results/*
    - name: Clean up
      if: always()
      run: |
        
        sudo rm -rf /tmp/test_results/*