#
# Node and deployment inventory. Check it without contacting any node:
#   ./fleet-setup.sh --list
#
# No passwords: the script uses key-based SSH. On the first run it creates identity_file if it is
# missing and runs ssh-copy-id, which asks for the node user's password once in your terminal.

recipes:
  weld:
    source_delivery: central_copy
    repository: https://github.com/vkb1/manufacturing-ai-suite.git
    ref: feature/vkb1/add-mcp-server-ts
    remote_root: manufacturing-ai-suite  # prompt path prefix; checkouts are isolated per deployment
    app_dir: industrial-edge-insights-multimodal
    skill:
      name: multimodal-deploy
      path: industrial-edge-insights-multimodal/.github/skills/multimodal-deploy
      # repository/ref can override the app repository/ref for a separate skill source.
    prompt: >-
      In ~/manufacturing-ai-suite/industrial-edge-insights-multimodal, Meet prerequisites
      (ignore accepting licenses check for downloading models from HF), build time series analytics
      microservice, build and deploy (pull latest weekly tags of intel/ images) the agentic
      variant with the MCP server (make up_agentic MCP=true), then run the smoke check.
      Do not edit .env; if a required credential is missing, stop and name it.
      Do not start or stop pipelines.
    approval_policy: >-
      APPROVE make build, make up_agentic, make down and make status (with or without MCP=true)
      and .github/skills/multimodal-deploy/scripts/smoke-check.sh when run from
      ~/manufacturing-ai-suite/industrial-edge-insights-multimodal.
      ESCALATE anything that edits .env, uses sudo, or touches paths outside that directory.
    environment:
      generate_users:
        - INFLUXDB_USERNAME
        - VISUALIZER_GRAFANA_USER
        - MTX_WEBRTCICESERVERS2_0_USERNAME
        - S3_STORAGE_USERNAME
        - SEAWEEDFS_WEB_AUTH_USER
        - MCP_USERNAME
      generate_passwords:
        - INFLUXDB_PASSWORD
        - VISUALIZER_GRAFANA_PASSWORD
        - MTX_WEBRTCICESERVERS2_0_PASSWORD
        - S3_STORAGE_PASSWORD
        - SEAWEEDFS_WEB_AUTH_PASSWORD
        - MCP_PASSWORD
      set:
        HOST_IP: "127.0.0.1"
    mcp:
      scheme: https
      port: 3000
      path: /mcp
      certificate:
        container: nginx_proxy
        path: /opt/nginx/certs/cert.pem
      auth:
        type: basic
        username_key: MCP_USERNAME
        password_key: MCP_PASSWORD
      tools:
        - describe
        - list_insights_data
        - explain
        - run_agent
        - get_run_results
        - start_pipeline
        - stop_pipeline

  wind_turbine:
    source_delivery: central_copy
    repository: https://github.com/vkb1/manufacturing-ai-suite.git
    ref: feature/vkb1/add-mcp-server-ts
    remote_root: manufacturing-ai-suite  # prompt path prefix; checkouts are isolated per deployment
    app_dir: industrial-edge-insights-time-series
    skill:
      name: time-series-deploy
      path: industrial-edge-insights-time-series/.github/skills/time-series-deploy
    prompt: >-
      In ~/manufacturing-ai-suite/industrial-edge-insights-time-series, follow
      time-series-deploy to meet prerequisites, build time series analytics
      microservice, build the sample app with MCP
      (make build MCP=true), deploy wind-turbine-anomaly-detection with MQTT
      ingestion and MCP (make up_mqtt_ingestion app=wind-turbine-anomaly-detection
      MCP=true), then run the skill smoke check with MCP=true. Do not edit .env;
      if a required credential or configuration is missing, stop and report it.
      Do not start or stop the analytics pipeline.
    approval_policy: >-
      APPROVE make build MCP=true, make status MCP=true and
      .github/skills/time-series-deploy/scripts/smoke-check.sh (with MCP=true)
      only in ~/manufacturing-ai-suite/industrial-edge-insights-time-series.
      ESCALATE make up_mqtt_ingestion, make down, any .env edits, analytics
      pipeline start/stop operations, sudo, and all commands outside that directory.
    environment:
      generate_users:
        - INFLUXDB_USERNAME
        - VISUALIZER_GRAFANA_USER
        - MCP_USERNAME
      generate_passwords:
        - INFLUXDB_PASSWORD
        - VISUALIZER_GRAFANA_PASSWORD
        - MCP_PASSWORD
      set:
        HOST_IP: "127.0.0.1"
    mcp:
      scheme: https
      port: 3000
      path: /mcp
      certificate:
        container: nginx_proxy
        path: /opt/nginx/certs/cert.pem
      auth:
        type: basic
        username_key: MCP_USERNAME
        password_key: MCP_PASSWORD
      tools:
        - describe
        - get_pipeline_status
        - start_pipeline
        - stop_pipeline
        - list_sources
        - list_insights_data
        - get_anomaly_summary
        - get_processing_metrics

defaults:
  user: deploy                              # same deployment account on every node (see the guide)
  port: 22                                  # SSH port
  identity_file: ~/.ssh/fleet_ed25519      # created if missing; omit to use your default SSH key
nodes:
  - name: node1
    host: node1.example.invalid             # replace with this node's IPv4 address or hostname
    deployments:
      - recipe: weld
        name: node1                         # stable MCP server/profile identity
        local_port: 13001
  - name: node2
    host: node2.example.invalid             # replace with this node's IPv4 address or hostname
    deployments:
      - recipe: wind_turbine
        name: node2                         # stable MCP server/profile identity
        local_port: 13002                   # explicit unique local port for every deployment
